[project]
name = "android-instagram-tools"
version = "0.9.1"
description = "Tools that drive the Instagram app on an Android phone over adb: feed_autoplay, profile_blocker"
readme = "README.md"
# The pinned versions below have ready-made wheels up to Python 3.13; uv fetches a matching
# Python by itself if the computer has none.
requires-python = ">=3.10,<3.14"
# The versions the tools were tested with (same as the container, see Dockerfile).
dependencies = [
    "uiautomator2==3.7.0",
    "adbutils==2.12.0",
    "numpy==2.2.6",
    "pillow==12.3.0",
]

[tool.uv]
# not an installable package: the tools are run as scripts (`uv run feed_autoplay.py ...`)
package = false

[dependency-groups]
build = [
    "pyinstaller==6.22.3",  # builds the Windows app (packaging/); not needed to run
]
