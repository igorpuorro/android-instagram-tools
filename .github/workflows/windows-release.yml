# Builds the Windows app (one-folder zip, packaging/build.py; DEVELOPMENT.md 1, "Windows app").
# On a version tag (v<version>, e.g. v0.2.3 = the version in pyproject.toml and feed_autoplay.py) it publishes a
# GitHub Release with the zip and its SHA-256; run by hand (Actions tab) it only builds, and the
# zip is downloadable from the run's artifacts.
name: windows-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # create the release

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      # all three run on Node.js 24 (Node.js 20 is deprecated on GitHub's runners)
      - uses: actions/checkout@v7

      # setup-uv publishes no major tags since v8 (supply-chain safety): pinned to the v10.3.2 commit
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

      # the exact package versions of uv.lock (--frozen), Python 3.13 like the tested setup;
      # build.py also self-checks the app (check, --help, adb version, profile_blocker --help)
      # and the bundle contents
      - name: Build and check the app
        run: uv run --frozen --python 3.13 --group build packaging/build.py

      - uses: actions/upload-artifact@v7
        with:
          name: android-instagram-tools-windows
          path: |
            build/android-instagram-tools-windows-*.zip
            build/android-instagram-tools-windows-*.zip.sha256

      - name: Publish the release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem build/android-instagram-tools-windows-*.zip, build/android-instagram-tools-windows-*.zip.sha256
          gh release create "$env:GITHUB_REF_NAME" $files.FullName `
            --title "android-instagram-tools $env:GITHUB_REF_NAME for Windows: feed_autoplay + profile_blocker" `
            --notes-file packaging/release-notes.md
